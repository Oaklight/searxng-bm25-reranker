repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        description: Type check both packages with ty.
        entry: ty check packages/bm25_reranker/src packages/sem_reranker/src
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v5.1.0
    hooks:
      - id: complexipy
        files: ^packages/(bm25_reranker|sem_reranker)/
        exclude: ^packages/(bm25_reranker|sem_reranker)/src/searxng_(bm25|sem)_reranker/_vendor/
        args: [-mx, "15"]
