# Tooling configuration for the monorepo.  Packaging lives in each package.

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["packages/bm25_reranker/src", "packages/sem_reranker/src"]
addopts = ["-ra", "--strict-markers", "-m", "not live and not stress"]
markers = [
    "live: calls a real provider API; skipped unless the key is set",
    "stress: large or adversarial inputs; run with make stress",
]

[tool.ty.environment]
python-version = "3.10"
extra-paths = [
    "packages/bm25_reranker/src",
    "packages/sem_reranker/src",
]

[tool.ty.src]
include = ["packages"]
exclude = ["**/_vendor/*"]
[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.ruff]
target-version = "py310"
exclude = ["packages/*/src/*/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "UP", "C901"]
ignore = ["UP007", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"packages/*/src/*/_vendor/*" = ["C901", "UP"]

[tool.complexipy]
paths = ["packages"]
max-complexity-allowed = 15
exclude = ["**/_vendor/*"]