name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/bm25_reranker[dev]" -e packages/sem_reranker

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

      - name: Run tests
        run: python -m pytest -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/bm25_reranker --outdir dist
          python -m build packages/sem_reranker --outdir dist
          python -m twine check dist/*

      - name: Verify runtime dependencies are empty
        run: |
          python - <<'PY'
          import glob
          import zipfile
          import email

          for wheel in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(wheel) as archive:
                  metadata = next(
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  )
                  message = email.message_from_bytes(archive.read(metadata))
              requires = message.get_all("Requires-Dist") or []
              runtime = [item for item in requires if "extra ==" not in item]
              if runtime:
                  raise SystemExit(f"{wheel} has runtime requirements: {runtime}")
              print(f"{wheel}: no runtime requirements")
          PY
