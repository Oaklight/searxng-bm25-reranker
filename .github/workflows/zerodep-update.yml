name: zerodep-update

on:
  schedule:
    - cron: "17 3 * * 1" # Weekly Monday 3:17 UTC
  workflow_dispatch:

# NOTE: PRs created by the default GITHUB_TOKEN do not trigger
# on:pull_request workflows. If you need CI checks on the auto-PR,
# use a GitHub App token or PAT instead of github.token.
permissions:
  contents: write
  pull-requests: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zerodep CLI
        run: pip install 'zerodep>=2026.9.9'

      - name: Update vendored modules in both packages
        run: |
          for pkg in packages/bm25_reranker packages/sem_reranker; do
            (cd "$pkg" && zerodep update --all)
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: zerodep-update
          delete-branch: true
          title: "chore(deps): update vendored zerodep modules"
          body: |
            Automated update of vendored zerodep modules in both packages.

            See the workflow step summary for the file list.
          labels: dependencies,zerodep
          commit-message: "chore(deps): update vendored zerodep modules"
